<style>
  :root{
    --bg:#070b08;
    --surface:#0d1410;
    --surface-2:#131e17;
    --line:#213024;
    --accent:#abff40;
    --accent-ink:#0d1a05;
    --ink:#edf2ea;
    --ink-dim:#89968c;
    --err:#ff8269;
    --gold:#d9c27a;
    --silver:#c7cdc9;
    --bronze:#c98c5e;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:600px;margin:0 auto;padding:0 0 60px;}

  header.top{
    padding:26px 22px 18px;
    border-bottom:1px solid var(--line);
  }
  header.top .brand{display:flex;align-items:center;gap:10px;}
  header.top .brand img{width:28px;height:28px;display:block;border-radius:6px;}
  header.top .brand .word{
    font-family:'Big Shoulders Display',sans-serif;
    font-weight:800;font-size:21px;line-height:1;
    letter-spacing:0.2px;color:var(--ink);
  }
  header.top .label{
    margin:10px 0 0;font-size:13px;font-weight:600;color:var(--ink-dim);
  }
  header.top .tagline{
    margin:4px 0 0;font-size:13px;font-weight:600;
    color:var(--accent);letter-spacing:0.2px;
  }
  header.top .back-btn{
    margin-top:14px;background:transparent;border:1px solid var(--line);
    color:var(--ink-dim);border-radius:8px;padding:8px 13px;
    font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;cursor:pointer;
  }

  main{padding:20px 22px 20px;}

  .panel{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:12px;
    padding:18px;
    margin-bottom:14px;
  }
  .panel-title{
    font-family:'Big Shoulders Display',sans-serif;
    font-weight:700;font-size:20px;color:var(--ink);
    margin:0 0 4px;
  }
  .panel-note{color:var(--ink-dim);font-size:12.5px;line-height:1.5;margin:0 0 16px;}

  label.field-label{display:block;font-size:12.5px;color:var(--ink-dim);margin:2px 0 8px;}
  input[type=text],input[type=email],input[type=password]{
    width:100%;padding:10px 2px;background:transparent;
    border:none;border-bottom:1.5px solid var(--line);border-radius:0;color:var(--ink);
    font-size:16px;font-family:'Inter',sans-serif;
  }
  input::placeholder{color:#4a5750;}
  input:focus{outline:none;border-bottom-color:var(--accent);}

  /* home */
  .announce-panel{padding:20px 18px;}
  .announce-title{
    font-family:'Big Shoulders Display',sans-serif;font-weight:800;
    font-size:19px;color:var(--ink);margin:0 0 10px;line-height:1.25;
  }
  .announce-body{font-size:13.5px;line-height:1.65;color:var(--ink-dim);margin:0 0 14px;}
  .announce-date{
    font-size:13px;color:var(--accent);margin:0;padding-top:12px;
    border-top:1px solid var(--line);
  }
  .announce-date b{font-weight:700;}
  .home-all-done{
    background:var(--surface);border:1px solid var(--accent);border-radius:10px;
    padding:13px 14px;font-size:13.5px;color:var(--accent);margin-bottom:18px;font-weight:600;
  }
  .award-chip-list{display:flex;flex-direction:column;gap:8px;}
  .award-chip{
    display:flex;align-items:center;gap:12px;
    background:var(--surface);border:1px solid var(--line);border-radius:10px;
    padding:14px;cursor:pointer;transition:border-color .12s, background .12s;
  }
  .award-chip:active{background:var(--surface-2);}
  .award-chip.done{cursor:default;opacity:0.55;}
  .award-chip .num{
    width:24px;height:24px;flex:0 0 24px;border-radius:6px;background:var(--surface-2);
    display:flex;align-items:center;justify-content:center;
    font-family:'Big Shoulders Display',sans-serif;font-size:12px;font-weight:700;color:var(--accent);
  }
  .award-chip.done .num{background:transparent;border:1.5px solid var(--accent);color:var(--accent);font-size:13px;}
  .award-chip .txt{flex:1;min-width:0;}
  .award-chip .txt b{font-size:14.5px;display:block;}
  .award-chip .txt small{font-size:12px;color:var(--ink-dim);display:block;margin-top:2px;}
  .award-chip .status{font-size:18px;color:var(--ink-dim);flex:0 0 auto;}
  .award-chip.done .status{color:var(--accent);}
  .award-chip .done-label{
    font-size:11.5px;font-weight:700;color:var(--accent);text-transform:uppercase;
    letter-spacing:0.3px;flex:0 0 auto;
  }

  /* voting */
  .progress-row{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 8px;}
  .progress-row .count{font-family:'Big Shoulders Display',sans-serif;font-weight:700;font-size:18px;color:var(--ink);}
  .progress-row .rehint{font-size:11.5px;color:var(--ink-dim);}
  .progress-track{height:3px;background:var(--surface-2);border-radius:2px;overflow:hidden;margin-bottom:14px;}
  .progress-fill{height:100%;background:var(--accent);transition:width .25s;}

  .scroll-wrap{position:relative;margin:0 -2px;}
  .cand-scroll{
    max-height:min(48vh, 420px);overflow-y:auto;padding:0 2px;
    scrollbar-width:thin;scrollbar-color:var(--line) transparent;
  }
  .cand-scroll::-webkit-scrollbar{width:5px;}
  .cand-scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}
  .scroll-fade{
    position:absolute;left:0;right:0;height:26px;pointer-events:none;
    opacity:0;transition:opacity .15s;
  }
  .scroll-fade.top{top:0;background:linear-gradient(var(--surface), transparent);}
  .scroll-fade.bottom{bottom:0;background:linear-gradient(transparent, var(--surface));}
  .scroll-wrap.can-scroll-up .scroll-fade.top{opacity:1;}
  .scroll-wrap.can-scroll-down .scroll-fade.bottom{opacity:1;}

  .candidate-list{display:flex;flex-direction:column;}
  .cand{
    display:flex;align-items:center;gap:12px;
    padding:11px 2px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
  }
  .cand:last-child{border-bottom:none;}
  .cand:active{opacity:0.8;}
  .cand .rank{
    width:24px;height:24px;flex:0 0 24px;
    border-radius:5px;
    border:1.5px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-family:'Big Shoulders Display',sans-serif;
    font-size:13px;font-weight:700;color:var(--ink-dim);
  }
  .cand .rank.circle{border-radius:50%;}
  .cand.picked .rank{border-color:var(--accent);color:var(--accent-ink);background:var(--accent);}
  .cand .name{flex:1;font-size:14.5px;}
  .cand .name b{font-weight:600;}
  .cand .pts{
    font-family:'Big Shoulders Display',sans-serif;
    font-size:15px;color:var(--ink-dim);min-width:20px;text-align:right;
  }
  .cand.picked .pts{color:var(--accent);}

  button.primary{
    width:100%;padding:14px;margin-top:16px;
    background:var(--accent);color:var(--accent-ink);border:none;border-radius:9px;
    font-family:'Inter',sans-serif;font-size:15px;font-weight:700;cursor:pointer;
    transition:filter .12s, opacity .12s;
  }
  button.primary:disabled{opacity:0.3;cursor:not-allowed;}
  button.primary:not(:disabled):active{filter:brightness(0.92);}

  button.ghost{
    width:100%;padding:11px;margin-top:9px;
    background:transparent;color:var(--ink-dim);border:1px solid var(--line);border-radius:9px;
    font-size:13px;font-weight:600;cursor:pointer;
  }

  .msg{
    padding:12px 14px;border-radius:8px;font-size:13px;margin-bottom:14px;
    line-height:1.55;white-space:pre-line;background:var(--surface-2);
    border-left:3px solid var(--line);
  }
  .msg.ok{border-left-color:var(--accent);}
  .msg.err{border-left-color:var(--err);}

  /* leaderboard (admin) */
  .board-row{
    display:flex;align-items:center;gap:12px;
    padding:10px 2px;border-bottom:1px solid var(--line);
  }
  .board-row:last-child{border-bottom:none;}
  .board-row .pos{
    width:20px;font-family:'Big Shoulders Display',sans-serif;font-weight:700;
    color:var(--ink-dim);font-size:14px;text-align:center;flex:0 0 20px;
  }
  .board-row:nth-child(1) .pos{color:var(--gold);}
  .board-row:nth-child(2) .pos{color:var(--silver);}
  .board-row:nth-child(3) .pos{color:var(--bronze);}
  .board-row .bname{flex:1;font-size:14px;}
  .board-row .bpts{
    font-family:'Big Shoulders Display',sans-serif;
    font-size:15px;color:var(--accent);font-weight:700;min-width:26px;text-align:right;
  }

  .stat-row{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .stat-box{flex:1;min-width:100px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;}
  .stat-box .n{font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:22px;color:var(--ink);line-height:1;}
  .stat-box .l{font-size:11px;color:var(--ink-dim);margin-top:4px;}

  /* individual votes list (admin) */
  .voter-list{max-height:60vh;overflow-y:auto;}
  .voter-row{
    padding:10px 2px;border-bottom:1px solid var(--line);
  }
  .voter-row:last-child{border-bottom:none;}
  .voter-head{
    display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px;
  }
  .voter-head .voter-num{
    font-family:'Big Shoulders Display',sans-serif;font-weight:700;font-size:13px;color:var(--accent);
  }
  .voter-head .voter-time{font-size:11px;color:var(--ink-dim);}
  .voter-picks{display:flex;flex-wrap:wrap;gap:6px;}
  .voter-pick-item{
    font-size:12.5px;color:var(--ink);background:var(--surface-2);
    border-radius:6px;padding:3px 8px;
  }
  .voter-pick-item b{color:var(--ink-dim);font-weight:700;margin-right:3px;}

  .loading{display:flex;align-items:center;gap:10px;color:var(--ink-dim);font-size:13px;padding:18px 0;justify-content:center;}
  .spinner{width:15px;height:15px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .danger-zone{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);}
  .danger-zone p{font-size:11.5px;color:var(--ink-dim);margin:8px 0 0;}
  button.danger{
    width:100%;padding:11px;background:transparent;color:var(--err);
    border:1px solid #422924;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;
  }
  .admin-nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
  .admin-nav button{
    background:var(--surface);border:1px solid var(--line);color:var(--ink-dim);
    border-radius:8px;padding:8px 11px;font-size:12px;font-weight:600;cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .admin-nav button.active{border-color:var(--accent);color:var(--accent);}
</style>

  // ---------- HOME SCREEN ----------
  function buildHomeScreen(){
    var wrap = document.createElement('div');

    if(state.homeMsg){
      var m = document.createElement('div');
      m.className = 'msg ' + state.homeMsg.type;
      m.textContent = state.homeMsg.text;
      wrap.appendChild(m);
      state.homeMsg = null;
    }

    var announce = document.createElement('div');
    announce.className = 'panel announce-panel';
    announce.innerHTML =
      '<p class="announce-title">🎙️ Oyunun Tempi kanalına xoş gəlmisiniz!</p>' +
      '<p class="announce-body">Bu il ilin ən yaxşılarını birgə seçirik. Aşağıdakı mükafatların hər birinə ayrıca daxil olub səsini verə bilərsən.</p>' +
      '<p class="announce-date">🗓️ Nəticələr <b>25 oktyabrda</b> açıqlanacaq.</p>';
    wrap.appendChild(announce);

    var allDone = CATEGORIES.every(function(c){ return !!state.completed[c.key]; });
    if(allDone){
      var doneBanner = document.createElement('div');
      doneBanner.className = 'home-all-done';
      doneBanner.textContent = '🎉 Bütün mükafatlara səs verdin. Təşəkkürlər!';
      wrap.appendChild(doneBanner);
    }

    var list = document.createElement('div');
    list.className = 'award-chip-list';
    CATEGORIES.forEach(function(c, i){
      var isDone = !!state.completed[c.key];
      var chip = document.createElement('div');
      chip.className = 'award-chip' + (isDone ? ' done' : '');
      var descText = c.type === 'rank' ? ('ilk ' + c.rankCount + '-u sırala') : 'qalibini seç';
      chip.innerHTML =
        '<span class="num">' + (isDone ? '✓' : (i+1)) + '</span>' +
        '<span class="txt"><b>' + c.title + '</b><small>' + c.subtitle + ' — ' + descText + '</small></span>' +
        (isDone ? '<span class="done-label">Tamamlandı</span>' : '<span class="status">→</span>');
      if(!isDone){
        chip.onclick = function(){
          state.screen = 'vote';
          state.stageIndex = i;
          state.picks = [];
          state.singlePick = null;
          state.voteMsg = null;
          render();
        };
      }
      list.appendChild(chip);
    });
    wrap.appendChild(list);

    return wrap;
  }

  // ---------- VOTE SCREEN (generic: rank or single) ----------
  function buildVoteScreen(){
    var cat = currentCategory();

    if(state.completed[cat.key]){
      state.screen = 'home';
      state.homeMsg = { type: 'err', text: 'Bu brauzerdən "' + cat.title + '" üçün artıq səs verilib.' };
      return buildHomeScreen();
    }

    var wrap = document.createElement('div');

    if(state.voteMsg){
      var m = document.createElement('div');
      m.className = 'msg ' + state.voteMsg.type;
      m.textContent = state.voteMsg.text;
      wrap.appendChild(m);
    }

    var card = document.createElement('div');
    card.className = 'panel';
    card.appendChild(cat.type === 'rank' ? buildRankBody(cat) : buildSingleBody(cat));
    wrap.appendChild(card);

    return wrap;
  }

  function buildRankBody(cat){
    var frag = document.createElement('div');

    var progRow = document.createElement('div');
    progRow.className = 'progress-row';
    progRow.innerHTML = '<span class="count">' + state.picks.length + ' / ' + cat.rankCount + '</span>' +
      (state.picks.length === cat.rankCount
        ? '<span class="rehint">sırayı dəyişmək üçün adı sıx</span>'
        : '<span class="rehint">1-ci ' + cat.points[0] + ', sonuncu ' + cat.points[cat.points.length-1] + ' xal</span>');
    frag.appendChild(progRow);

    var track = document.createElement('div');
    track.className = 'progress-track';
    track.innerHTML = '<div class="progress-fill" style="width:' + (state.picks.length / cat.rankCount * 100) + '%"></div>';
    frag.appendChild(track);

    var listLabel = document.createElement('label');
    listLabel.className = 'field-label';
    listLabel.style.margin = '2px 0 6px';
    listLabel.textContent = 'Namizədlər (' + cat.candidates.length + ')';
    frag.appendChild(listLabel);

    var scrollWrap = document.createElement('div');
    scrollWrap.className = 'scroll-wrap';

    var scrollBox = document.createElement('div');
    scrollBox.className = 'cand-scroll';

    var list = document.createElement('div');
    list.className = 'candidate-list';
    cat.candidates.forEach(function(name){
      var idx = state.picks.indexOf(name);
      var row = document.createElement('div');
      row.className = 'cand' + (idx > -1 ? ' picked' : '');
      var parts = name.split(' ');
      var last = parts.pop();
      var first = parts.join(' ');
      row.innerHTML =
        '<span class="rank">' + (idx > -1 ? (idx+1) : '') + '</span>' +
        '<span class="name">' + (first ? first + ' <b>' + last + '</b>' : '<b>' + last + '</b>') + '</span>' +
        '<span class="pts">' + (idx > -1 ? cat.points[idx] : '') + '</span>';
      row.onclick = function(){
        var i = state.picks.indexOf(name);
        if(i > -1){
          state.picks.splice(i,1);
        } else if(state.picks.length < cat.rankCount){
          state.picks.push(name);
        }
        render();
      };
      list.appendChild(row);
    });
    scrollBox.appendChild(list);

    var fadeTop = document.createElement('div');
    fadeTop.className = 'scroll-fade top';
    var fadeBottom = document.createElement('div');
    fadeBottom.className = 'scroll-fade bottom';

    scrollWrap.appendChild(scrollBox);
    scrollWrap.appendChild(fadeTop);
    scrollWrap.appendChild(fadeBottom);
    frag.appendChild(scrollWrap);

    function updateFades(){
      candScrollTop = scrollBox.scrollTop;
      var canUp = scrollBox.scrollTop > 2;
      var canDown = scrollBox.scrollTop + scrollBox.clientHeight < scrollBox.scrollHeight - 2;
      scrollWrap.classList.toggle('can-scroll-up', canUp);
      scrollWrap.classList.toggle('can-scroll-down', canDown);
    }
    scrollBox.onscroll = updateFades;
    requestAnimationFrame(function(){
      scrollBox.scrollTop = candScrollTop;
      updateFades();
    });

    var submitBtn = document.createElement('button');
    submitBtn.className = 'primary';
    submitBtn.textContent = state.submitting ? 'Göndərilir...' : 'Səsimi göndər';
    submitBtn.disabled = state.picks.length !== cat.rankCount || state.submitting;
    submitBtn.onclick = function(){ submitStage(cat, state.picks); };
    frag.appendChild(submitBtn);

    if(state.picks.length === cat.rankCount){
      var resetBtn = document.createElement('button');
      resetBtn.className = 'ghost';
      resetBtn.textContent = 'Seçimi sıfırla';
      resetBtn.onclick = function(){ state.picks = []; render(); };
      frag.appendChild(resetBtn);
    }

    return frag;
  }

  function buildSingleBody(cat){
    var frag = document.createElement('div');

    var listLabel = document.createElement('label');
    listLabel.className = 'field-label';
    listLabel.style.margin = '2px 0 10px';
    listLabel.textContent = 'Qalibi seç (' + cat.candidates.length + ' namizəd)';
    frag.appendChild(listLabel);

    var list = document.createElement('div');
    list.className = 'candidate-list';
    cat.candidates.forEach(function(name){
      var picked = state.singlePick === name;
      var row = document.createElement('div');
      row.className = 'cand' + (picked ? ' picked' : '');
      row.innerHTML =
        '<span class="rank circle">' + (picked ? '✓' : '') + '</span>' +
        '<span class="name"><b>' + name + '</b></span>';
      row.onclick = function(){
        state.singlePick = picked ? null : name;
        render();
      };
      list.appendChild(row);
    });
    frag.appendChild(list);

    var submitBtn = document.createElement('button');
    submitBtn.className = 'primary';
    submitBtn.textContent = state.submitting ? 'Göndərilir...' : 'Səsimi göndər';
    submitBtn.disabled = !state.singlePick || state.submitting;
    submitBtn.onclick = function(){ submitStage(cat, state.singlePick); };
    frag.appendChild(submitBtn);

    return frag;
  }

  function markCompleted(cat){
    state.completed[cat.key] = true;
    saveCompleted(state.completed);
  }

  function submitStage(cat, payload){
    var isRank = cat.type === 'rank';
    if(isRank && payload.length !== cat.rankCount) return;
    if(!isRank && !payload) return;

    // Local (per-browser) guard, checked before any network call — catches
    // cases where the vote screen was reached for an already-completed
    // category (e.g. by manipulating app state directly). This works
    // alongside the server-side IP check below, not instead of it.
    if(state.completed[cat.key]){
      state.picks = [];
      state.singlePick = null;
      state.screen = 'home';
      state.homeMsg = { type: 'err', text: 'Bu brauzerdən "' + cat.title + '" üçün artıq səs verilib.' };
      render();
      return;
    }

    state.submitting = true;
    state.voteMsg = null;
    render();

    Promise.all([getClientIP(), authReady]).then(function(results){
      var ip = results[0];
      var ref = db.collection(cat.collection).doc(ipKey(ip));
      var data = isRank
        ? { picks: payload, ts: firebase.firestore.FieldValue.serverTimestamp() }
        : { pick: payload, ts: firebase.firestore.FieldValue.serverTimestamp() };
      ref.set(data)
        .then(function(){
          state.submitting = false;
          markCompleted(cat);
          state.picks = [];
          state.singlePick = null;
          state.screen = 'home';
          state.homeMsg = { type: 'ok', text: '"' + cat.title + '" üzrə səsin qeydə alındı. Təşəkkürlər!' };
          render();
        })
        .catch(function(err){
          state.submitting = false;
          if(err && err.code === 'permission-denied'){
            // already voted from this IP for this award — lock it locally too
            markCompleted(cat);
            state.picks = [];
            state.singlePick = null;
            state.screen = 'home';
            state.homeMsg = { type: 'err', text: 'Bu IP ünvanından "' + cat.title + '" üçün artıq səs verilib.' };
          } else {
            state.voteMsg = { type: 'err', text: 'Səs göndərilə bilmədi. Bir az sonra yenidən cəhd et.' };
          }
          render();
        });
    }).catch(function(){
      state.submitting = false;
      state.voteMsg = { type: 'err', text: 'IP ünvanın müəyyən edilə bilmədi, səs qəbul olunmadı. İnternet bağlantını yoxlayıb yenidən cəhd et.' };
      render();
    });
  }

  // ---------- RESULTS (admin only) ----------
  var resultsCache = {};

  function computeLeaderboard(cat, docsArr){
    var totals = {};
    cat.candidates.forEach(function(c){ totals[c] = 0; });
    if(cat.type === 'rank'){
      docsArr.forEach(function(v){
        (v.picks || []).forEach(function(name, idx){
          if(totals.hasOwnProperty(name)) totals[name] += (cat.points[idx] || 0);
        });
      });
    } else {
      docsArr.forEach(function(v){
        if(v.pick && totals.hasOwnProperty(v.pick)) totals[v.pick] += 1;
      });
    }
    var arr = cat.candidates.map(function(c){ return {name:c, pts: totals[c]}; });
    arr.sort(function(a,b){ return b.pts - a.pts; });
    return arr;
  }

  function loadResults(catKey, forceReload){
    var cat = CATEGORIES.filter(function(c){ return c.key === catKey; })[0];
    if(!cat) return;
    if(resultsCache[catKey] && !forceReload){
      state.results[catKey] = resultsCache[catKey];
      return;
    }
    state.resultsLoading[catKey] = true;
    state.resultsError[catKey] = null;
    render();

    db.collection(cat.collection).get().then(function(snap){
      var docs = [];
      snap.forEach(function(doc){
        var d = doc.data();
        if(d){
          d._voterId = doc.id;
          docs.push(d);
        }
      });
      var payload = { votes: docs, leaderboard: computeLeaderboard(cat, docs) };
      resultsCache[catKey] = payload;
      state.results[catKey] = payload;
      state.resultsLoading[catKey] = false;
      render();
    }).catch(function(){
      state.resultsLoading[catKey] = false;
      state.resultsError[catKey] = 'Nəticələr yüklənə bilmədi. Bir az sonra yenidən cəhd et.';
      render();
    });
  }

  function loadResultsIfNeeded(catKey){
    if(!state.results[catKey] && !state.resultsLoading[catKey]){
      loadResults(catKey);
    }
  }

  // ---------- ADMIN ----------
  function buildAdminScreen(){
    var wrap = document.createElement('div');

    if(!state.adminUnlocked){
      var card = document.createElement('div');
      card.className = 'panel';
      card.innerHTML = '<p class="panel-title">Admin girişi</p>';

      if(state.adminError){
        var em = document.createElement('div');
        em.className = 'msg err';
        em.textContent = state.adminError;
        card.appendChild(em);
      }

      var passLabel = document.createElement('label');
      passLabel.className = 'field-label';
      passLabel.textContent = 'Giriş kodu';
      card.appendChild(passLabel);

      var input = document.createElement('input');
      input.type = 'password';
      input.placeholder = 'Kodu yaz';
      input.value = state.adminPassInput;
      input.oninput = function(e){ state.adminPassInput = e.target.value; };
      input.onkeydown = function(e){ if(e.key === 'Enter') tryLogin(); };
      card.appendChild(input);

      var btn = document.createElement('button');
      btn.className = 'primary';
      btn.textContent = state.adminLoggingIn ? 'Yoxlanılır...' : 'Daxil ol';
      btn.disabled = state.adminLoggingIn;
      btn.onclick = tryLogin;
      card.appendChild(btn);

      wrap.appendChild(card);
      return wrap;
    }

    var activeCat = CATEGORIES.filter(function(c){ return c.key === state.adminTab; })[0] || CATEGORIES[0];
    loadResultsIfNeeded(activeCat.key);

    var nav = document.createElement('div');
    nav.className = 'admin-nav';
    CATEGORIES.forEach(function(c){
      var b = document.createElement('button');
      b.textContent = c.title;
      if(c.key === activeCat.key) b.className = 'active';
      b.onclick = function(){ state.adminTab = c.key; render(); };
      nav.appendChild(b);
    });
    wrap.appendChild(nav);

    var data = state.results[activeCat.key];

    var strip = document.createElement('div');
    strip.className = 'stat-row';
    var totalPts = data ? data.leaderboard.reduce(function(s,r){ return s + r.pts; }, 0) : null;
    strip.innerHTML =
      '<div class="stat-box"><div class="n">' + (data ? data.votes.length : '—') + '</div><div class="l">iştirakçı sayı</div></div>' +
      '<div class="stat-box"><div class="n">' + (totalPts !== null ? totalPts : '—') + '</div><div class="l">ümumi xal</div></div>';
    wrap.appendChild(strip);

    var card2 = document.createElement('div');
    card2.className = 'panel';
    card2.innerHTML = '<p class="panel-title">' + activeCat.title + ' — Ümumi cədvəl</p>';

    if(state.resultsLoading[activeCat.key] && !data){
      var l = document.createElement('div');
      l.className = 'loading';
      l.innerHTML = '<span class="spinner"></span><span>Yüklənir...</span>';
      card2.appendChild(l);
    } else if(state.resultsError[activeCat.key]){
      var e = document.createElement('div');
      e.className = 'msg err';
      e.textContent = state.resultsError[activeCat.key];
      card2.appendChild(e);
    } else {
      var d = data || { votes: [], leaderboard: computeLeaderboard(activeCat, []) };

      if(d.votes.length === 0){
        var empty = document.createElement('p');
        empty.className = 'panel-note';
        empty.style.margin = '0';
        empty.textContent = 'Hələ səs yoxdur.';
        card2.appendChild(empty);
      } else {
        d.leaderboard.forEach(function(row, i){
          var r = document.createElement('div');
          r.className = 'board-row';
          r.innerHTML = '<span class="pos">' + (i+1) + '</span><span class="bname">' + row.name + '</span><span class="bpts">' + row.pts + '</span>';
          card2.appendChild(r);
        });
      }

      var refreshBtn = document.createElement('button');
      refreshBtn.className = 'ghost';
      refreshBtn.textContent = state.resultsLoading[activeCat.key] ? 'Yenilənir...' : 'Yenilə';
      refreshBtn.disabled = !!state.resultsLoading[activeCat.key];
      refreshBtn.onclick = function(){ loadResults(activeCat.key, true); };
      card2.appendChild(refreshBtn);

      var dz = document.createElement('div');
      dz.className = 'danger-zone';
      var dangerBtn = document.createElement('button');
      dangerBtn.className = 'danger';
      dangerBtn.textContent = state.resetting ? 'Silinir...' : 'Bu mükafatın bütün səslərini sil';
      dangerBtn.disabled = state.resetting;
      dangerBtn.onclick = function(){ resetVotes(activeCat); };
      dz.appendChild(dangerBtn);
      var dzNote = document.createElement('p');
      dzNote.textContent = 'Geri qaytarılmır.';
      dz.appendChild(dzNote);
      card2.appendChild(dz);
    }

    wrap.appendChild(card2);

    if(d){
      var card3 = document.createElement('div');
      card3.className = 'panel';
      card3.innerHTML = '<p class="panel-title">Bütün səslər (' + d.votes.length + ')</p>' +
        '<p class="panel-note">Hər sətir bir iştirakçının verdiyi səsdir.</p>';

      if(d.votes.length === 0){
        var empty2 = document.createElement('p');
        empty2.className = 'panel-note';
        empty2.style.margin = '0';
        empty2.textContent = 'Hələ səs yoxdur.';
        card3.appendChild(empty2);
      } else {
        var sortedVotes = d.votes.slice().sort(function(a,b){
          var ta = (a.ts && a.ts.toMillis) ? a.ts.toMillis() : 0;
          var tb = (b.ts && b.ts.toMillis) ? b.ts.toMillis() : 0;
          return tb - ta; // most recent first
        });
        var voterList = document.createElement('div');
        voterList.className = 'voter-list';
        sortedVotes.forEach(function(v, i){
          var row = document.createElement('div');
          row.className = 'voter-row';

          var when = (v.ts && v.ts.toDate) ? v.ts.toDate().toLocaleString('az-AZ') : '—';

          var voteHtml;
          if(activeCat.type === 'rank'){
            voteHtml = (v.picks || []).map(function(name, idx){
              return '<span class="voter-pick-item"><b>' + (idx+1) + '.</b> ' + name + '</span>';
            }).join('');
          } else {
            voteHtml = '<span class="voter-pick-item"><b>Seçim:</b> ' + (v.pick || '—') + '</span>';
          }

          row.innerHTML =
            '<div class="voter-head"><span class="voter-num">#' + (i+1) + '</span>' +
            '<span class="voter-time">' + when + '</span></div>' +
            '<div class="voter-picks">' + voteHtml + '</div>';
          voterList.appendChild(row);
        });
        card3.appendChild(voterList);
      }

      wrap.appendChild(card3);
    }

    var resetAllBtn = document.createElement('button');
    resetAllBtn.className = 'danger';
    resetAllBtn.style.marginBottom = '10px';
    resetAllBtn.textContent = state.resetting ? 'Silinir...' : 'BÜTÜN mükafatların səslərini sil';
    resetAllBtn.disabled = state.resetting;
    resetAllBtn.onclick = resetAllVotes;
    wrap.appendChild(resetAllBtn);

    var logout = document.createElement('button');
    logout.className = 'ghost';
    logout.textContent = 'Admin paneldən çıx';
    logout.onclick = function(){ state.adminUnlocked = false; render(); };
    wrap.appendChild(logout);

    return wrap;
  }

  function tryLogin(){
    state.adminError = null;

    if(state.adminPassInput !== ADMIN_CODE){
      state.adminError = 'Kod səhvdir.';
      render();
      return;
    }

    state.adminLoggingIn = true;
    render();
    // Everyone already has an anonymous session from page load; just make
    // sure it's actually ready before unlocking the admin screen.
    authReady
      .then(function(){
        state.adminLoggingIn = false;
        state.adminPassInput = '';
        state.adminUnlocked = true;
        render();
      })
      .catch(function(){
        state.adminLoggingIn = false;
        state.adminError = 'Giriş alınmadı. Bir az sonra yenidən cəhd et.';
        render();
      });
  }

  function deleteAllDocsInCollection(collectionName){
    return db.collection(collectionName).get().then(function(snap){
      var docs = snap.docs;
      var i = 0, batchSize = 400; // Firestore batch write limit is 500 ops
      function nextBatch(){
        if(i >= docs.length) return Promise.resolve();
        var batch = db.batch();
        var slice = docs.slice(i, i+batchSize);
        slice.forEach(function(d){ batch.delete(d.ref); });
        i += slice.length;
        return batch.commit().then(nextBatch);
      }
      return nextBatch();
    });
  }

  function resetVotes(cat){
    if(!confirm('Əminsən? "' + cat.title + '" üzrə bütün səslər həmişəlik silinəcək.')) return;
    state.resetting = true;
    render();
    deleteAllDocsInCollection(cat.collection).then(function(){
      resultsCache[cat.key] = null;
      state.resetting = false;
      loadResults(cat.key, true);
    }).catch(function(){
      state.resetting = false;
      render();
    });
  }

  function resetAllVotes(){
    if(!confirm('Əminsən? BÜTÜN mükafatlar üzrə bütün səslər həmişəlik silinəcək.')) return;
    state.resetting = true;
    render();
    Promise.all(CATEGORIES.map(function(c){ return deleteAllDocsInCollection(c.collection); }))
      .then(function(){
        resultsCache = {};
        state.resetting = false;
        loadResults(state.adminTab, true);
      })
      .catch(function(){
        state.resetting = false;
        render();
      });
  }

  render();
})();
</script>
</body>
</html>
